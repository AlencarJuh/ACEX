<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="">FSAberCampo</a>

            <button>Perfil</button>
        </nav>
    </header>

    <form action="">

        <fieldset class="etapa-dados">
            <legend>Etapa 1: Dados pessoais</legend>
            <label for="">Nome Completo</label>
            <input type="text">
            
            <label for="">Email</label>
            <input type="text">
            
            <label for="">Celular</label>
            <input type="text">
            
            <label for="">CPF</label>
            <input type="text">

            <button>Avançar</button>
        </fieldset>
        
        
        <fieldset class="etapa-formacao">
            <legend>Etapa 2: Formação acadêmica</legend>
            <label for="">Nível de formação</label>
            <input type="text">
            
            <label for="">Universidade</label>
            <input type="text">
            
            <label for="">Curso</label>
            <input type="text">
            
            <label for="">Código de validação (?)</label>
            <input type="text">
            
            <button>Adicionar curso</button>
            <button>Voltar</button>
            <button>Avançar</button>
        </fieldset>
        
        <fieldset class="etapa-endereco">
            <legend>Etapa 3: Endereço</legend>
            <label for="">País</label>
            <input type="text">
            
            <label for="">Estado</label>
            <input type="text">
            
            <label for="">Cidade</label>
            <input type="text">
            
            <label for="">Rua</label>
            <input type="text">
            
            <label for="">N°</label>
            <input type="text">
            
            <label for="">Bloco</label>
            <input type="text">
            
            <label for="">Apartamento</label>
            <input type="text">
            
            <label for="">N/A</label>
            <input type="checkbox">

            <button>Voltar</button>
            <button>Avançar</button>
        </fieldset>
        
        <fieldset class="etapa-senha">
            <legend>Etapa 4: Criar senha</legend>
            <label for="">Senha</label>
            <input type="text">
            
            <label for="">Confirmar senha</label>
            <input type="text">
            
            <input type="checkbox">
            <p>Li e concordo com os <a href="">Termos de uso</a> e <a href="">Política de privacidade</a>.</p>

            <button>Voltar</button>
            <button>Cadastrar</button>
        </fieldset>
    </form>
    
    
</body>
</html>
