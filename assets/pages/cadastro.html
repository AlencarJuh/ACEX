<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSAberCampo | Cadastro</title>
    <link rel="stylesheet" href="../styles/cadastro3.css">
    <link rel="icon" href="../images/logo.png" alt="Logotipo da FSAberCampo">

</head>

<body>
    <header>
        <nav>
            <a href="../../index.html" id="logo">FSAberCampo</a>

            <ul>
                <li><a href="login.html" id="nav-entrar">Entrar</a></li>
                <li><a href="" id="nav-cadastrar">Cadastrar</a></li>
            </ul>
        </nav>
    </header>

    <h2>Cadastro</h2>

    <form action="" method="post">

        <!--Escolha de usuário-->
        <fieldset class="tipo-usuario">
            <legend>Selecione um tipo de usuário</legend>
            <h3>Selecione um tipo de usuário</h3>

            <div>
                <label>
                    <img src="../icons/tipo-aluno.png" alt="Ícone do usuário tipo 'aluno'">
                    Sou aluno
                    <input type="radio" name="tipo-usuario" value="tipo-aluno" required>
                </label>

                <label>
                    <img src="../icons/tipo-professor.png" alt="Ícone do usuário tipo 'professor'">
                    Sou professor
                    <input type="radio" name="tipo-usuario" value="tipo-professor">
                </label>
            </div>

            <div class="botoes-inferiores">
                <button type="button" id="confirmar-tipo-usuario" class="botao-confirmar">Confirmar</button>
            </div>
        </fieldset>

        <!--Cadastro-->
        <!--Etapa 1: Dados pessoais-->
        <fieldset class="dados-pessoais">
            <legend>Etapa 1: Dados pessoais</legend>
            <h3>Dados pessoais</h3>

            <label for="nome-completo">
                Nome Completo
                <input type="text" id="nome-completo" name="nome-completo" required>
            </label>

            <label for="email">
                Email
                <input type="email" id="email" name="email" required>
            </label>

            <label for="cpf">
                CPF
                <input type="number" id="cpf" name="cpf" required>
            </label>

            <label for="celular">
                Celular
                <input type="tel" id="celular" name="celular" required>
            </label>

            <span class="botoes-inferiores">
                <button type="button" class="botao-voltar" aria-label="Voltar">←</button>
                <button type="button" class="botao-avancar">Avançar</button>
            </span>
        </fieldset> <!--Etapa 1: Dados pessoais-->

        <!--Etapa 2: Endereço-->
        <fieldset class="endereco">
            <legend>Etapa 2: Endereço</legend>
            <h3>Endereço</h3>

            <div>
                <label for="select-pais">
                    País
                    <select id="select-pais" name="pais" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="brasil">Brasil</option>
                    </select>
                </label>

                <label>
                    Estado
                    <select id="estado" name="estado" required>
                        <option value="" disabled selected>Selecione um estado</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                </label>

                <label for="cidade" class="cidade">
                    Cidade
                    <input type="text" id="cidade" name="cidade" required>
                </label>

                <!-- <span class="rua-casa"> -->
                    <label for="input-rua" class="label-rua">
                        Rua
                        <input type="text" id="input-rua" name="rua" required>
                    </label>

                    <label for="input-casa" class="label-casa">
                        N°
                        <input type="number" id="input-casa" name="num-casa" required>
                    </label>
                <!-- </span> -->

                <!-- <span class="bloco-apt-na"> -->
                    <label for="input-bloco" class="label-bloco">
                        Bloco
                        <input type="text" id="input-bloco" name="apt-bloco" required>
                    </label>

                    <label for="input-apartamento" class="label-apt">
                        Apt.
                        <input type="number" id="input-apartamento" name="apt-num" required>
                    </label>

                    <label for="input-na" class="label-na">
                        N/A
                        <input type="checkbox" id="input-na" name="nao-aplica" required>
                    </label>
                <!-- </span> -->
            </div>

            <span class="botoes-inferiores">
                <button type="button" class="botao-voltar" aria-label="Voltar">←</button>
                <button type="button" class="botao-avancar">Avançar</button>
            </span>
        </fieldset>

        <!--Etapa 3: Formação acadêmica-->
        <fieldset class="formacao-academica">
            <legend>Etapa 3: Formação acadêmica</legend>

            <h3>Formação acadêmica</h3>

            <label for="nivel-formacao">
                Nível de formação
                <select id="nivel-formacao" name="nivel-formacao" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="fundamental-incompleto">Ensino Fundamental Incompleto</option>
                    <option value="fundamental-completo">Ensino Fundamental Completo</option>
                    <option value="medio-incompleto">Ensino Médio Incompleto</option>
                    <option value="medio-completo">Ensino Médio Completo</option>
                    <option value="superior-incompleto">Ensino Superior Incompleto</option>
                    <option value="superior-completo">Ensino Superior Completo</option>
                </select>
            </label>

            <label for="universidade">
                Universidade
                <input type="text" id="universidade" name="universidade" required>
            </label>

            <label for="curso">
                Curso
                <input type="text" id="curso" name="curso" required>
            </label>

            <label for="codigo-validacao-diploma">
                Código de validação (?)
                <input type="text" id="codigo-validacao-diploma" name="codigo-validacao-diploma" required>
            </label>

            <button type="button" id="adicionar-curso">+ Adicionar curso</button>

            <span class="botoes-inferiores">
                <button type="button" class="botao-voltar" aria-label="Voltar">←</button>
                <button type="button" class="botao-avancar">Avançar</button>
            </span>

        </fieldset>

        <!--Etapa 4: Criar seha-->
        <fieldset class="criar-senha">
            <legend>Etapa 4: Criar senha</legend>

            <h3>Criar senha</h3>

            <label for="senha">
                Senha
                <input type="password" 
                    id="senha" 
                    name="senha" 
                    minlength="8" 
                    pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}"
                    required>
            </label>

            <div class="criterios-senha">
                <span>
                    <input type="checkbox" name="criterio-senha-caracteres" id="criterio-senha-caracteres" required>
                    <label for="criterio-senha-caracteres">Deve conter no mínimo 8 caracteres</label>
                </span>
                
                <span>
                    <input type="checkbox" name="criterio-senha-maiuscula" id="criterio-senha-letras" required>
                    <label for="criterio-senha-maiuscula">Deve conter letras</label>
                </span>

                <span>
                    <input type="checkbox" name="riterio-senha-numeros" id="criterio-senha-numeros" required>
                    <label for="criterio-senha-numeros">Deve conter números</label>
                </span>

                <span>
                    <input type="checkbox" name="criterio-senha-caracteres-especiais" id="criterio-senha-caracteres-especiais" required>
                    <label for="criterio-senha-caracteres-especiais">Deve conter caracteres especiais</label>
                </span>
            </div>

            <label for="confirmar-senha">
                Confirmar senha
                <input type="password" id="confirmar-senha" name="confirmar-senha" required>
            </label>

            <div class="termos-politica">
                <label for="termos-politica" >
                    <input type="checkbox" id="termos-politica" name="termos-politica" required >
                    <span>
                        Li e concordo com os <a href="" target="_blank">Termos de uso</a>
                        e <a href="" target="_blank">Política de privacidade</a>.
                    </span>
                </label>
            </div>

            <span class="botoes-inferiores">
                <button type="button" class="botao-voltar" aria-label="Voltar">←</button>
                <button type="submit" class="botao-cadastrar">Cadastrar</button>
            </span>
        </fieldset>

    </form>

    <script src="../script/cadastro.js"></script>
</body>

</html>
