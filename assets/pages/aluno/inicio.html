<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSAberCampo | Início</title>
    <link rel="stylesheet" href="../../styles/pagina-principal.css">
    <link rel="stylesheet" href="../../styles/alunos/inicio.css">
    <link rel="icon" href="../../images/logo.png" alt="Logotipo da FSAberCampo">
</head>

<body>

    <!-- Menu lateral -->
    <aside>

        <header>
        <!-- Logotipo -->
            <a href="inicio.html" id="logo">FSAberCampo</a>

            <!-- Caixa de pesquisa -->
            <div class="input-pesquisar">
                <label for="nav-pesquisar"> Input de pesquisa</label>
                <img src="../../icons/lupa.png" alt="">
                <input id="nav-pesquisar" type="search" placeholder="Pesquisar">
            </div>
        </header>

        <!-- Lista de links do menu lateral -->
        <ul class="aside-lista-guias">
            
            <!-- Início -->
            <li class="aside-inicio">
                <a href="inicio.html">
                    <img src="../../icons/início.png" alt="ìcone de casa">
                    <span>Início</span>
                </a>
            </li>

            <!-- Área de atividades -->
            <li class="aside-atividades">
                <a href="area-atividades.html">
                    <img src="../../icons/atividades.png" alt="ìcone de casa">
                    <span>Área de atividades</span>
                </a>
            </li>

            <!-- Calendário / lembretes -->
            <li class="aside-calendario">
                <a href="calendario.html">
                    <img src="../../icons/calendário.png" alt="ìcone de casa">
                    <span>Calendário / lembretes</span>
                </a>
            </li>

            <!-- Fórum -->
            <li class="aside-forum">
                <a href="forum.html">
                    <img src="../../icons/fórum.png" alt="ìcone de casa">
                    <span>Fórum</span>
                </a>
            </li>
        </ul>

        <!-- Notificações, configuração e perfil -->
        <ul class="aside-lista-configs">
            <li>
                <button type="button" id="botao-notificacoes">
                    <img src="../../icons/sino.png" alt="">
                    <p>Notificações</p>
                </button>
            </li>

            <li>
                <button type="button" id="botao-configuracoes">
                    <img src="../../icons/configurações.png" alt="">
                    <p>Configurações</p>
                </button>
            </li>

            <li>
                <button type="button" id="botao-perfil">
                    <img src="../../icons/perfil.png" alt="">
                    <p>Perfil</p>
                </button>
            </li>
        </ul>
    </aside>

    <!--Página inicial-->
    <div class="tela-inicial">

        <!--Card de saudação-->
        <section class="saudacao">
            <img id="profile-pic" src="../../images/cachorro na panela.jpg" alt="">
            <p id="saudacao">Olá, <span id="user-name">[nome]</span>! </p>
        </section>

        <!--Card de matérias-->
        <section class="materias">
            <p>Matérias</p>
        </section>
        
        <!--Card de área de atividade-->
        <section class="area-atividades">
            <p>Área de atividades</p>
        </section>

        <!--Card de calendario-->
        <section class="calendario">
            <p>Calendário</p>
        </section>
        
        <!--Card de eventos proximos-->
        <section class="eventos-proximos">
            <p>Eventos próximos</p>
        </section>

        <!--Card de professores e chat-->
        <section class="professores-e-chat">
            <p>Professores e chat</p>
        </section>
    </div>

    <!-- Container de menus (Notificações, configurações e perfil) -->
    <div class="container-menus">

        <!-- Container de notificações -->
        <div class="container-notificacoes">

        </div>

        <!-- Container de configurações -->
        <div class="container-configuracoes">

        </div>
        
        <!-- Container de perfil -->
        <div class="container-perfil">

        </div>

    </div>
</body>

</html>
