<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSAberCampo | Início</title>
    <link rel="stylesheet" href="../../styles/inicialProfessor.css">
    <link rel="icon" href="../../images/logo.png" alt="Logotipo da FSAberCampo">
</head>
<body>
    <header>
        <nav>
            <a href="" id="logo">FSAberCampo</a>
            
            <label for="nav-pesquisar"> Input de pesquisa</label>
            <div class="input-pesquisar">
                <img src="../../icons/lupa.png" alt="">
                <input id="nav-pesquisar" type="search" placeholder="Pesquisar">
            </div>

            <ul>
                <li><button type="button">
                    <p>Notificações</p>
                    <img src="../../icons/sino.png" alt="">
                </button></li>

                <li><button type="button">
                    <p>Configurações</p>
                    <img src="../../icons/configurações.png" alt="">
                </button></li>
                
                <li><button type="button">
                    <p>Perfil</p>
                    <img src="../../icons/perfil.png" alt="">
                </button></li>
            </ul>

        </nav>
    </header>

    <aside>
        <button type="button">
            <img src="../../icons/bars.png" alt="Icon do botão expandir">
        </button>

        <ul>
            <li class="aside-inicio">
            <a href="inicialProfessor.html">
                <img src="../../icons/início.png" alt="ìcone de casa">
                <p>Início</p>
            </a>
            </li>
            
            <li class="aside-alunos">
            <a href="gerenciar-alunos.html">
                <img src="../../icons/alunos.png" alt="ìcone de casa">
                <p>Gerenciar alunos</p>
            </a>
            </li>
            
            <li class="aside-atividades">
            <a href="area-atividades.html">
                <img src="../../icons/atividades.png" alt="ìcone de casa">
                <p>Área de atividades</p>
            </a>
            </li>
            
            <li class="aside-calendario">
            <a  href="calendario.html">
                <img src="../../icons/calendário.png" alt="ìcone de casa">
                <p>Calendário / lembretes</p>
            </a>
            </li>
            
            <li class="aside-forum">
            <a href="forum.html">
                <img src="../../icons/fórum.png" alt="ìcone de casa">
                <p>Fórum</p>
            </a>
            </li>
        </ul>
    </aside>

    <!--Página inicial-->
    <div class="tela-inicial">
    
    <!--Módulo de saudação-->
    <section class="saudacao">
        <img id="profile-pic" src="../../images/cachorro na panela.jpg" alt="">
        <p id="saudacao">Olá, <span id="user-name">[nome]</span>! </p>
    </section>
    
    <!--Módulo de total de alunos-->
    <section class="total-alunos">
        <p>Total de alunos</p>
        
    </section>
    
    <!--Módulo de área de atividade-->
    <section class="area-atividades">
        <h2>Área de atividades</h2>

        <table>
            <thead>
                <tr>
                    <th style="width: 30%;">Atividade</th>
                    <th style="width: 30%;">Auno</th>
                    <th style="width: 30%;">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="nome-atividade">At. 1</td>
                    <td id="nome-aluno">Maria</td>
                    <td id="status-atividade">Concluído</td>
                </tr>
            </tbody>
        </table>

    </section>
    
    <!--Módulo de alunos e chat-->
    <section class="alunos-e-chat">
        <p>Alunos e chat</p>
        
    </section>
    
    <!--Módulo de biblioteca e conteúdos-->
    <section class="biblioteca-conteudos">
        <p>Biblioteca e conteúdos</p>
        
    </section>
    
    <!--Módulo de biblioteca de atividades-->
    <section class="biblioteca-atividades">
        <p>Biblioteca de atividades</p>

    </section>
    
    <!--Módulo de calendario-->
    <section class="calendario">
        <p>Calendário</p>
        
    </section>
    
    <!--Módulo de eventos proximos-->
    <section class="eventos-proximos">
        <p>Eventos próximos</p>

    </section>
    </div>
</body>
</html>
